name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      # Credenciales para tests con variables de entorno (.env no se versiona).
      # Si defines los secrets en el repo, se usan esos; si no, valores publicos de la demo.
      LOCKED_USER: ${{ secrets.LOCKED_USER || 'locked_out_user' }}
      LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD || 'secret_sauce' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      timeout-minutes: 20
      run: npx playwright install --with-deps chromium firefox webkit msedge
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
