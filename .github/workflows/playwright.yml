name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Imagen oficial de Playwright: trae Chromium, Firefox y WebKit con todas
    # sus dependencias del sistema (evita apt-get en el runner).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      # Credenciales para tests con variables de entorno (.env no se versiona).
      # Si defines los secrets en el repo, se usan esos; si no, valores publicos de la demo.
      LOCKED_USER: ${{ secrets.LOCKED_USER || 'locked_out_user' }}
      LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD || 'secret_sauce' }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      # Edge no se puede instalar dentro del contenedor; se prueba solo en local.
      run: npx playwright test --project=chromium --project=firefox --project=webkit
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
