name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Imagen oficial de Playwright: trae Chromium, Firefox y WebKit con todas
    # sus dependencias del sistema (evita apt-get en el runner).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      # Credenciales opcionales: si defines estos secrets se usan; si no, los valores publicos.
      SAUCE_USER: ${{ secrets.SAUCE_USER || 'standard_user' }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
      SAUCE_LOCKED_USER: ${{ secrets.SAUCE_LOCKED_USER || 'locked_out_user' }}
      SAUCE_LOCKED_PASSWORD: ${{ secrets.SAUCE_LOCKED_PASSWORD || 'secret_sauce' }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
