name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Permisos minimos: leer el repo y publicar el reporte en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicacion de Pages a la vez; no se cancela una en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Imagen oficial de Playwright: trae Chromium, Firefox y WebKit con todas
    # sus dependencias del sistema (evita apt-get en el runner).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      # Credenciales opcionales: si defines estos secrets se usan; si no, los valores publicos.
      SAUCE_USER: ${{ secrets.SAUCE_USER || 'standard_user' }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
      SAUCE_LOCKED_USER: ${{ secrets.SAUCE_LOCKED_USER || 'locked_out_user' }}
      SAUCE_LOCKED_PASSWORD: ${{ secrets.SAUCE_LOCKED_PASSWORD || 'secret_sauce' }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER || 'problem_user' }}
      SAUCE_PROBLEM_PASSWORD: ${{ secrets.SAUCE_PROBLEM_PASSWORD || 'secret_sauce' }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npm test
    # Historial de Allure: se baja el del ultimo reporte publicado (si existe)
    # para mostrar la tendencia entre ejecuciones.
    - name: Download Allure history
      if: ${{ !cancelled() }}
      run: curl -fsSL "https://proctosis0.github.io/ecommerce-ai-qa-playwright/history.jsonl" -o history.jsonl || echo "Sin historial previo"
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: |
        npx allure generate ./allure-results
        cp history.jsonl allure-report/history.jsonl
        cp -r playwright-report allure-report/playwright
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-reports
        path: allure-report/
        retention-days: 30
    # Artefacto para GitHub Pages: Allure en la raiz y el reporte de Playwright en /playwright
    - uses: actions/upload-pages-artifact@v3
      if: ${{ !cancelled() && github.event_name == 'push' }}
      with:
        path: allure-report/

  deploy-report:
    # Publica los reportes (Allure + Playwright) del ultimo push, aunque algun test haya fallado
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
